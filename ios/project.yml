# XcodeGen spec: `brew install xcodegen && xcodegen generate` creates Confluence.xcodeproj.
# The web app (npm run build -> dist/index.html) is copied into Confluence/www first.
name: Confluence
options:
  bundleIdPrefix: app.confluence
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Confluence:
    type: application
    platform: iOS
    sources:
      - path: Confluence
        excludes:
          - "www"
          - "www/**"
      - path: Confluence/www
        type: folder
        buildPhase: resources
    info:
      path: Confluence/Info.plist
      properties:
        CFBundleDisplayName: Confluence
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleDefault
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.confluence.ethsim
        PRODUCT_NAME: Confluence
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
